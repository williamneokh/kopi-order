{{if .}}
<div class="space-y-4">
    {{range .}}
    <div class="flex items-center justify-between bg-white p-5 rounded-xl shadow-md">
        <div class="flex items-baseline space-x-4">
            <span class="text-5xl font-bold text-amber-800 w-16 text-right">{{.Count}}x</span>
            <span class="text-3xl font-semibold text-gray-900">{{.Name}}</span>
        </div>
        <div class="text-4xl pr-2">
            {{getDrinkIcon .Name}}
        </div>
    </div>
    {{end}}
</div>
{{else}}
<div class="text-center py-16">
    <p class="text-gray-500 text-lg">No orders have been placed yet.</p>
</div>
{{end}}
